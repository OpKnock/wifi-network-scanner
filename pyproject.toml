[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wifi-network-scanner"
version = "0.1.0"
description = "Passive 802.11 beacon analysis toolkit (educational)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools]
packages = ["wifiscan"]
